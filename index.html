<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a63d9e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kivra">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Kivra</title>
  <link rel="stylesheet" href="/theme.css">
<style>
:root{--p:#a63d9e;--p2:#e0589a;--bg:#fbf5fa;--bd:#f0dcec;--tx:#2a1830;--mu:#7d6a85;--soft:#f6e8f3}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--tx);line-height:1.55}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px rgba(166,61,158,.25)}
header b{font-size:20px;letter-spacing:.5px}
header span{flex:1;color:#ffe9f6;font-size:14px}
header button{background:rgba(255,255,255,.2);color:#fff;padding:8px 14px}
main{max-width:760px;margin:0 auto;padding:16px 16px 100px}
.narrow{max-width:430px;margin:28px auto 0}
.logo{font-size:34px;font-weight:800;background:linear-gradient(135deg,var(--p),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent;margin:0 0 6px}
.card{background:#fff;border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px rgba(166,61,158,.07)}
h2{margin:0 0 10px;font-size:18px;color:var(--p)}
label{display:block;margin:10px 0;font-size:14px;color:#5a4562}
input,select{display:block;width:100%;margin-top:4px;padding:11px;border:1px solid #e6cfe1;border-radius:12px;font-size:16px;background:#fff;color:inherit}
input:focus,select:focus{outline:2px solid var(--p2);border-color:var(--p2)}
button{padding:10px 16px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-size:15px;cursor:pointer}
button.ghost{background:var(--soft);color:var(--p)} button.red{background:#c0392b}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;background:var(--soft);color:var(--p)}
.pending{background:#fff3cd;color:#7a5b00}.approved{background:#d8f3e8;color:#0a5a41}.rejected{background:#fde2de;color:#9b2a1d}
.muted{color:var(--mu);font-size:13px}
.lock{color:#9b6b00;font-weight:600}
.price{font-size:18px;font-weight:700;color:var(--p)}
.item{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 0;border-top:1px solid #f4e6f0}
.item:first-child{border-top:0}
.offer{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px dashed var(--bd);margin-top:6px}
.loc{background:var(--soft);border-radius:14px;padding:10px 12px;margin:10px 0}
.wh{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid #f4e6f0}
.wh:first-child{border-top:0}
.av{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;flex:none}
.wh .in{flex:1}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:8px 2px;font-size:11px;display:flex;flex-direction:column;align-items:center;position:relative}
nav button.on{color:var(--p);font-weight:700}
nav .ico{font-size:21px;line-height:1.2}
nav .cnt{position:absolute;top:2px;left:50%;margin-left:8px;background:var(--p2);color:#fff;border-radius:99px;font-size:10px;padding:0 6px}
#toast{position:fixed;bottom:calc(78px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#2a1830;color:#fff;padding:10px 16px;border-radius:12px;max-width:90%;z-index:9}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const APP = 'Kivra';
const SUPPORT_PHONE = '';   // رقم واتساب للتواصل (بالصيغة الدولية بدون +) مثال: 201000000000
const SUPABASE_URL = 'https://xnvxhnohmkblkrjkuepu.supabase.co';
const SUPABASE_KEY = 'sb_publishable_RVvnRmfskuNJRYw8YVMRdA_enWXzNgI';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app = $('#app');
const STATUS = {pending:'قيد المراجعة', approved:'مفعّل', rejected:'مرفوض'};
const ROLE = {admin:'أدمن', warehouse:'مخزن', pharmacy:'صيدلية'};
const OST = {pending:'بانتظار المخزن', accepted:'مقبول', rejected:'مرفوض', cancelled:'ملغي', delivered:'تم التسليم', received:'تم الاستلام'};
const MAPRE = /^https:\/\/(www\.google\.com\/maps|maps\.google\.com|maps\.app\.goo\.gl|goo\.gl\/maps)/i;
const TABS = {
  pharmacy:[['dist','🏪','الموزعين'],['prod','🛍️','المنتجات'],['cart','🛒','السلة'],['ord','📋','طلباتي'],['acc','👤','حسابي']],
  warehouse:[['ord','📋','الطلبات'],['mine','📦','منتجاتي'],['acc','👤','حسابي']],
  admin:[['acct','👥','الحسابات'],['ord','📋','الطلبات'],['comm','💰','العمولة']]
};
const money = n => Number(n || 0).toFixed(2) + ' ج.م';
const fd = d => d ? new Date(d).toLocaleDateString('ar-EG') : '';
let ME = null, TAB = '', CAT = [], OFF = [], WH = [], WHF = null, CART = {}, ORD = [], RATED = new Set(), GEO = null;

function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,4500)}
async function run(fn){try{await fn()}catch(e){toast(e.message||'حصل خطأ، حاول تاني')}}
const ok = r => { if (r.error) throw r.error; return r.data };
const cartCount = () => Object.keys(CART).length;

async function boot(t){
  const {data:{session}} = await sb.auth.getSession();
  if(!session) return authView('login');
  const {data:p,error} = await sb.from('profiles').select('*').eq('id',session.user.id).single();
  if(error||!p){toast('تعذر تحميل الحساب');return authView('login')}
  ME = p; GEO = null;
  app.innerHTML = `<header><b>${APP}</b><span>${esc(p.business_name)} · ${ROLE[p.role]}</span><button data-act="logout">خروج</button></header><main id="main"></main><nav id="nav"></nav>`;
  const ks = TABS[p.role].map(x=>x[0]);
  await show(ks.includes(t) ? t : ks[0]);
}
function paintNav(){
  $('#nav').innerHTML = TABS[ME.role].map(([k,i,l])=>`<button class="${k===TAB?'on':''}" data-act="tab" data-t="${k}"><span class="ico">${i}</span>${l}${k==='cart'&&cartCount()?`<span class="cnt">${cartCount()}</span>`:''}</button>`).join('');
}
async function show(t){
  TAB = t; paintNav();
  const m = $('#main'); m.innerHTML = '<p class="muted">جاري التحميل...</p>';
  window.scrollTo(0,0);
  if(ME.role==='warehouse' && ME.status!=='approved' && t!=='acc'){
    m.innerHTML = '<div class="card"><h2>حسابك لسه ما اتفعّلش</h2><p class="muted">ارفع الرخصة من تبويب حسابي، وهنفعّل حسابك بعد المراجعة.</p></div>'; return;
  }
  await run(()=>V[ME.role][t](m));
}

function authView(mode){
  const su = mode==='signup'; GEO = null;
  app.innerHTML = `<main class="card narrow"><div class="logo">${APP}</div><form id="af">
  ${su?`<label>نوع الحساب<select id="role"><option value="pharmacy">صيدلية</option><option value="warehouse">مخزن</option></select></label>
  <label>اسم الصيدلية / المخزن<input id="bn" required></label>
  <label>رقم الموبايل<input id="ph" type="tel" required></label>
  <label>العنوان بالتفصيل<input id="ad" required></label>
  <div id="locbox" class="loc"><button type="button" class="ghost" data-act="geo">📍 حدد موقعي الحالي</button>
  <span id="geost" class="muted">لم يتم تحديد الموقع</span>
  <label>أو الصق رابط الموقع من خرائط جوجل<input id="mu" dir="ltr" placeholder="https://maps.app.goo.gl/..."></label>
  <div class="muted">حدد الموقع وإنت في الصيدلية، أو الصق رابط الخرائط.</div></div>`:''}
  <label>الإيميل<input id="em" type="email" required></label>
  <label>الباسورد (8 حروف على الأقل)<input id="pw" type="password" minlength="8" required></label>
  <button>${su?'إنشاء حساب':'دخول'}</button></form>
  <p><a href="#" data-act="${su?'tologin':'tosignup'}" style="color:var(--p)">${su?'عندي حساب':'إنشاء حساب جديد'}</a></p></main>`;
  if(su) $('#role').onchange = () => { $('#locbox').hidden = $('#role').value!=='pharmacy'; };
  $('#af').onsubmit = e => { e.preventDefault(); run(async()=>{
    const email=$('#em').value.trim(), password=$('#pw').value;
    if(su){
      const role=$('#role').value, mu=($('#mu').value||'').trim(), ph=role==='pharmacy';
      if(ph){
        if(mu && !MAPRE.test(mu)) throw new Error('الرابط لازم يكون من خرائط جوجل');
        if(!GEO && !mu) throw new Error('حدد موقع الصيدلية أو الصق رابط الخرائط');
      }
      const r = await sb.auth.signUp({email,password,options:{data:{role,business_name:$('#bn').value.trim(),phone:$('#ph').value.trim(),address:$('#ad').value.trim(),
        lat:ph&&GEO?GEO.lat:'',lng:ph&&GEO?GEO.lng:'',maps_url:ph?mu:''}}});
      if(r.error) throw r.error;
      if(!r.data.session){toast('تم إنشاء الحساب. افتح إيميلك واضغط رابط التأكيد، وبعدها ادخل.');return authView('login')}
    } else {
      const r = await sb.auth.signInWithPassword({email,password});
      if(r.error) throw new Error('الإيميل أو الباسورد غلط');
    }
    boot();
  })};
}

/* ---------- كروت مشتركة ---------- */
function licenseBox(){
  const p=ME, st=`<span class="badge ${p.status}">${STATUS[p.status]}</span>`;
  let h=`<div class="card"><h2>حالة الحساب ${st}</h2>`;
  if(p.status==='approved') return h+`<p class="muted">حسابك مفعّل.</p></div>`;
  if(p.status==='pending'&&p.license_path) return h+`<p class="muted">تم رفع الرخصة، في انتظار مراجعة الإدارة.</p></div>`;
  if(p.status==='rejected') h+=`<p class="muted">تم رفض الرخصة. ارفع رخصة سارية وواضحة.</p>`;
  else h+=`<p class="muted">ارفع صورة أو PDF للرخصة عشان نفعّل حسابك.</p>`;
  return h+`<label>ملف الرخصة (صورة أو PDF، أقل من 5 ميجا)<input id="lf" type="file" accept="image/*,application/pdf"></label>
  <label>تاريخ انتهاء الرخصة<input id="le" type="date"></label>
  <button data-act="uplic">رفع الرخصة</button></div>`;
}
function locCard(force){
  if(ME.role!=='pharmacy') return '';
  const has = (ME.lat!=null || ME.maps_url) && ME.address;
  if(!force && has) return '';
  return `<div class="card"><h2>📍 العنوان والموقع</h2>${has?'':'<p class="muted">مطلوب عشان المخزن يقدر يوصّل لك.</p>'}
  <label>العنوان بالتفصيل<input id="ad" value="${esc(ME.address)}"></label>
  <button type="button" class="ghost" data-act="geo">📍 حدد موقعي الحالي</button>
  <span id="geost" class="muted">${ME.lat!=null?'تم تحديد موقع سابق ✓':'لم يتم تحديد الموقع'}</span>
  <label>أو رابط خرائط جوجل<input id="mu" dir="ltr" value="${esc(ME.maps_url)}"></label>
  <button data-act="saveloc">حفظ</button></div>`;
}
const infoCard = () => `<div class="card"><h2>بيانات الحساب</h2><div><b>${esc(ME.business_name)}</b> <span class="badge">${ROLE[ME.role]}</span></div>
  <div class="muted">الموبايل: ${esc(ME.phone)}</div>${ME.address?`<div class="muted">العنوان: ${esc(ME.address)}</div>`:''}</div>`;
const extraCards = () => `<div class="card"><h2>تواصل معنا</h2>${SUPPORT_PHONE?`<a href="https://wa.me/${esc(SUPPORT_PHONE)}" target="_blank" rel="noopener"><button type="button">واتساب</button></a>`:'<p class="muted">سيتم إضافة وسيلة التواصل قبل الإطلاق.</p>'}</div>
  <div class="card"><details><summary><b>الشروط والأحكام</b></summary><p class="muted">سيتم إضافة الشروط والأحكام قبل الإطلاق الرسمي.</p></details></div>`;

/* ---------- الطلبات (مشتركة) ---------- */
const ob = (t,id,st,cls='') => `<button class="${cls}" data-act="ostat" data-id="${esc(id)}" data-st="${st}">${t}</button>`;
function ordersHtml(l, role){
  if(!l.length) return '<p class="muted">لا توجد طلبات.</p>';
  return l.map(o=>{
    const it=o.items||[], com=it.reduce((s,i)=>s+Number(i.commission||0),0), net=it.reduce((s,i)=>s+Number(i.net||0),0);
    const who = role==='pharmacy' ? `المخزن: ${esc(o.warehouse)} · ${esc(o.warehouse_phone)}`
      : role==='warehouse' ? `الصيدلية: ${esc(o.pharmacy)} · ${esc(o.pharmacy_phone)}<br>العنوان: ${esc(o.pharmacy_address)}`
      : `${esc(o.pharmacy)} ← ${esc(o.warehouse)}`;
    let act='';
    if(role==='warehouse'){
      if(o.status==='pending') act=ob('قبول',o.id,'accepted')+ob('رفض',o.id,'rejected','red');
      else if(o.status==='accepted') act=ob('تم التسليم',o.id,'delivered')+ob('إلغاء الطلب',o.id,'rejected','red');
    } else if(role==='pharmacy'){
      if(o.status==='pending') act=ob('إلغاء الطلب',o.id,'cancelled','red');
      else if(o.status==='delivered') act=ob('تأكيد الاستلام',o.id,'received');
      else if(o.status==='received' && !RATED.has(o.id)) act=`<button class="ghost" data-act="rate" data-id="${esc(o.id)}">⭐ قيّم المخزن</button>`;
    }
    if(role!=='pharmacy') act+=`<button class="ghost" data-act="openloc" data-id="${esc(o.id)}">📍 موقع الصيدلية</button>`;
    const cls=o.status==='received'?'approved':(o.status==='rejected'||o.status==='cancelled')?'rejected':'pending';
    return `<div class="item" style="display:block"><div><b>طلب #${o.order_no}</b> <span class="badge ${cls}">${OST[o.status]}</span> <span class="muted">${fd(o.created_at)}</span></div>
    <div class="muted">${who}</div>
    ${it.map(i=>`<div>${esc(i.name)} × ${i.qty} — ${money(i.unit_price)}</div>`).join('')}
    <div><b>الإجمالي: ${money(o.total)}</b></div>
    ${role!=='pharmacy'?`<div class="muted">عمولة المنصة: ${money(com)} · صافي المخزن بعد العمولة: ${money(net)}</div>`:''}
    ${o.status==='delivered'?`<div class="muted">يتأكد الاستلام تلقائياً بعد 7 أيام من التسليم.</div>`:''}
    ${o.received_at?`<div class="muted">تاريخ الاستلام: ${fd(o.received_at)}${o.auto_received?' (تلقائي)':''}</div>`:''}
    <div class="row" style="margin-top:8px">${act}</div></div>`;
  }).join('');
}

/* ---------- صيدلية ---------- */
const whName = id => (WH.find(w=>w.id===id)||{}).business_name || '';
async function vDist(m){
  WH = ok(await sb.rpc('list_warehouses'));
  m.innerHTML = `<div class="card"><h2>الموزعين</h2>${WH.length?WH.map(w=>`<div class="wh"><div class="av">${esc((w.business_name||'?').trim().charAt(0))}</div>
  <div class="in"><b>${esc(w.business_name)}</b>
  <div class="muted">${w.city?esc(w.city)+' · ':''}${Number(w.rating_count)>0?'★ '+Number(w.rating).toFixed(1)+' ('+w.rating_count+')':'جديد'}</div>
  <div class="muted">الحد الأدنى: ${Number(w.min_order)>0?money(w.min_order):'لا يوجد'}</div>
  ${w.delivery_days?`<div class="muted">التوصيل: ${esc(w.delivery_days)}</div>`:''}
  <div class="muted">${w.products_count} منتج</div>
  <button class="ghost" style="margin-top:6px" data-act="whfilter" data-id="${esc(w.id)}">عرض المنتجات</button></div></div>`).join(''):'<p class="muted">لا يوجد موزعين مفعّلين بعد.</p>'}</div>`;
}
async function vProd(m){
  OFF = ok(await sb.rpc('get_offers'));
  if(!WH.length) WH = ok(await sb.rpc('list_warehouses'));
  m.innerHTML = `<div class="card"><h2>المنتجات</h2>
  ${ME.status!=='approved'?'<p class="lock">🔒 الأسعار والطلب بعد تفعيل حسابك.</p>':''}
  ${WHF?`<div class="row" style="margin-bottom:8px"><span class="badge">المخزن: ${esc(whName(WHF))}</span><button class="ghost" data-act="whclear">كل المخازن</button></div>`:''}
  <input id="q" placeholder="ابحث باسم المنتج أو الماركة أو المخزن"><div id="cat"></div></div>`;
  $('#q').oninput = drawOffers; drawOffers();
}
function drawOffers(){
  const q=($('#q').value||'').trim().toLowerCase(), g={};
  OFF.filter(o=>(!WHF||o.warehouse_id===WHF)&&[o.name,o.brand,o.category,o.warehouse_name].join(' ').toLowerCase().includes(q))
     .forEach(o=>{(g[o.group_key]=g[o.group_key]||{n:o.name,b:o.brand,c:o.category,l:[]}).l.push(o)});
  const gs=Object.values(g);
  $('#cat').innerHTML = gs.length ? gs.map(x=>{
    x.l.sort((a,b)=>((a.price==null)-(b.price==null))||(Number(a.price)-Number(b.price)));
    return `<div class="item" style="display:block"><b>${esc(x.n)}</b><div class="muted">${esc(x.b)} ${x.c?'· '+esc(x.c):''}</div>
    ${x.l.map((o,i)=>`<div class="offer"><div>${esc(o.warehouse_name)}${i===0&&o.price!=null&&x.l.length>1?' <span class="badge approved">الأقل سعراً</span>':''}
    <div class="muted">المتاح: ${o.stock}</div></div>
    <div>${o.price==null?'<span class="lock">🔒 بعد التفعيل</span>':`<div class="price">${money(o.price)}</div>
    ${o.stock>0?`<div class="row"><input id="q-${esc(o.id)}" type="number" min="1" max="${o.stock}" value="1" style="width:64px;margin:0"><button data-act="addc" data-id="${esc(o.id)}">+ سلة</button></div>`:'<span class="muted">نفدت الكمية</span>'}`}</div></div>`).join('')}</div>`;
  }).join('') : '<p class="muted">لا توجد منتجات.</p>';
}
async function vCart(m){
  if(!WH.length) WH = ok(await sb.rpc('list_warehouses'));
  paintCart();
}
function paintCart(){
  const m=$('#main'), gs={};
  Object.entries(CART).forEach(([id,v])=>{(gs[v.whid]=gs[v.whid]||{n:v.wh,l:[]}).l.push([id,v])});
  if(!Object.keys(gs).length){m.innerHTML='<div class="card"><h2>السلة</h2><p class="muted">السلة فاضية.</p></div>';return}
  let total=0;
  const html=Object.entries(gs).map(([wid,g])=>{
    const sub=g.l.reduce((s,[,v])=>s+v.price*v.q,0); total+=sub;
    const w=WH.find(x=>x.id===wid), min=Number(w?w.min_order:0), low=sub<min;
    return `<div class="card"><h2>${esc(g.n)}</h2>${g.l.map(([id,v])=>`<div class="item"><div><b>${esc(v.name)}</b><div class="muted">${v.q} × ${money(v.price)}</div></div><button class="red" data-act="rmc" data-id="${esc(id)}">حذف</button></div>`).join('')}
    <div><b>إجمالي المخزن: ${money(sub)}</b></div>
    ${min>0?`<div class="${low?'lock':'muted'}">الحد الأدنى للطلب: ${money(min)}${low?' · ناقص '+money(min-sub):' ✓'}</div>`:''}
    ${w&&w.delivery_days?`<div class="muted">التوصيل: ${esc(w.delivery_days)}</div>`:''}</div>`;
  }).join('');
  m.innerHTML = html + `<div class="card"><p><b>الإجمالي الكلي: ${money(total)}</b></p><button data-act="placeo">إرسال الطلب</button>
  <p class="muted">الدفع بيتم للمخزن مباشرة. لو السلة فيها أكتر من مخزن، هيتقسم لطلب لكل مخزن.</p></div>`;
}
async function vOrdP(m){
  ORD = ok(await sb.rpc('my_orders'));
  RATED = new Set(ok(await sb.rpc('rated_orders')) || []);
  m.innerHTML = `<div class="card"><h2>طلباتي</h2>${ordersHtml(ORD,'pharmacy')}</div>`;
}
async function vAcc(m){ m.innerHTML = infoCard() + licenseBox() + locCard(true) + extraCards(); }

/* ---------- مخزن ---------- */
async function vOrdW(m){
  ORD = ok(await sb.rpc('my_orders'));
  const x = (ok(await sb.rpc('my_ledger'))||[])[0] || {};
  m.innerHTML = `<div class="card"><h2>حسابك مع المنصة (العمولة)</h2>
  <div class="muted">العمولة المستحقة للمنصة: ${money(x.due)} · المسدّد: ${money(x.paid)}</div>
  <div><span class="price">المتبقي: ${money(x.balance)}</span></div>
  <div class="muted">العمولة بتتحسب من الطلبات المستلمة بس.</div></div>
  <div class="card"><h2>الطلبات</h2>${ordersHtml(ORD,'warehouse')}</div>`;
}
async function vMine(m){
  m.innerHTML = `<div class="card"><h2>إضافة منتج</h2>
  <label>اسم المنتج<input id="pn"></label>
  <div class="grid"><label>الماركة<input id="pb"></label><label>القسم<input id="pc"></label>
  <label>السعر العام (ج.م)<input id="pp" type="number" min="0" step="0.01"></label>
  <label>خصمك % من السعر العام<input id="pd" type="number" min="0" max="100" step="0.01"></label>
  <label>الكمية المتاحة<input id="ps" type="number" min="0" step="1"></label></div>
  <button data-act="addp">إضافة</button></div><div class="card"><h2>منتجاتي</h2><div id="mine"></div></div>`;
  loadMine();
}
async function loadMine(){
  const l = ok(await sb.from('products').select('*').eq('warehouse_id',ME.id).order('created_at',{ascending:false}));
  $('#mine').innerHTML = l.length ? l.map(x=>`<div class="item"><div><b>${esc(x.name)}</b>
  <div class="muted">${esc(x.brand)} · سعر عام ${money(x.public_price)} · خصمك ${x.warehouse_discount_pct}%${x.hidden_by_admin?' · مخفي بواسطة الإدارة':''}</div></div>
  <div class="row"><input id="st-${esc(x.id)}" type="number" min="0" step="1" value="${x.stock}" style="width:90px;margin:0">
  <button data-act="savestock" data-id="${esc(x.id)}">حفظ الكمية</button>
  <button class="red" data-act="delp" data-id="${esc(x.id)}">حذف</button></div></div>`).join('')
  : '<p class="muted">لسه مفيش منتجات.</p>';
}
async function vAccW(m){
  m.innerHTML = infoCard() + licenseBox() + `<div class="card"><h2>بيانات المخزن للصيدليات</h2>
  <label>المدينة<input id="wc" value="${esc(ME.city)}"></label>
  <label>الحد الأدنى للطلب (ج.م)<input id="wm" type="number" min="0" step="1" value="${Number(ME.min_order||0)}"></label>
  <label>مواعيد التوصيل<input id="wd" placeholder="مثال: يوميا عدا الجمعة" value="${esc(ME.delivery_days)}"></label>
  <button data-act="savewh">حفظ</button></div>` + extraCards();
}

/* ---------- أدمن ---------- */
async function vAdmAcc(m){
  const l = ok(await sb.from('profiles').select('*').neq('role','admin').order('created_at',{ascending:false}));
  l.sort((a,b)=>(a.status==='pending'?0:1)-(b.status==='pending'?0:1));
  m.innerHTML = `<div class="card"><h2>الحسابات</h2>${l.length?l.map(x=>`<div class="item"><div>
  <b>${esc(x.business_name)}</b> <span class="badge">${ROLE[x.role]}</span> <span class="badge ${x.status}">${STATUS[x.status]}</span>
  <div class="muted">${esc(x.phone)} ${x.license_expiry?'· الرخصة تنتهي '+esc(x.license_expiry):''}</div></div>
  <div class="row">${x.license_path?`<button class="ghost" data-act="viewlic" data-path="${esc(x.license_path)}">عرض الرخصة</button>`:'<span class="muted">لا توجد رخصة</span>'}
  ${x.status!=='approved'?`<button data-act="setst" data-id="${esc(x.id)}" data-st="approved">موافقة</button>`:''}
  ${x.status!=='rejected'?`<button class="red" data-act="setst" data-id="${esc(x.id)}" data-st="rejected">رفض</button>`:''}</div></div>`).join(''):'<p class="muted">لا توجد حسابات بعد.</p>'}</div>`;
}
async function vAdmOrd(m){
  ORD = ok(await sb.rpc('my_orders'));
  m.innerHTML = `<div class="card"><h2>كل الطلبات</h2>${ordersHtml(ORD,'admin')}</div>`;
}
async function vComm(m){
  const s = ok(await sb.from('settings').select('commission_pct').eq('id',1).single());
  const led = ok(await sb.rpc('admin_ledger'));
  m.innerHTML = `<div class="card"><h2>نسبة عمولتك % (للطلبات الجديدة)</h2><div class="row">
  <input id="cm" type="number" min="0" max="99" step="0.01" value="${s.commission_pct}" style="width:120px;margin:0">
  <button data-act="savecomm">حفظ</button></div></div>
  <div class="card"><h2>حسابات المخازن (عمولاتك)</h2>${led.length?led.map(x=>`<div class="item"><div><b>${esc(x.warehouse_name)}</b>
  <div class="muted">المستحق ${money(x.due)} · المسدّد ${money(x.paid)}</div>
  <div class="price">المتبقي ${money(x.balance)}</div></div>
  <div class="row"><input id="pa-${esc(x.warehouse_id)}" type="number" min="0" step="0.01" placeholder="المبلغ" style="width:110px;margin:0">
  <button data-act="pay" data-id="${esc(x.warehouse_id)}">تسجيل دفعة</button></div></div>`).join(''):'<p class="muted">لا توجد مخازن.</p>'}</div>`;
}

const V = {
  pharmacy:{dist:vDist,prod:vProd,cart:vCart,ord:vOrdP,acc:vAcc},
  warehouse:{ord:vOrdW,mine:vMine,acc:vAccW},
  admin:{acct:vAdmAcc,ord:vAdmOrd,comm:vComm}
};

/* ---------- الأوامر ---------- */
const A = {
  tab: el => show(el.dataset.t),
  logout: async()=>{await sb.auth.signOut();ME=null;CART={};WHF=null;WH=[];authView('login')},
  tologin: ()=>authView('login'),
  tosignup: ()=>authView('signup'),
  geo: ()=>new Promise((res,rej)=>{
    if(!navigator.geolocation) return rej(new Error('المتصفح لا يدعم تحديد الموقع'));
    navigator.geolocation.getCurrentPosition(p=>{
      GEO={lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6)};
      const s=$('#geost'); if(s) s.textContent='تم تحديد الموقع ✓'; res();
    },()=>rej(new Error('تعذر تحديد الموقع. اسمح للمتصفح بالوصول للموقع، أو الصق رابط الخرائط')),{enableHighAccuracy:true,timeout:15000});
  }),
  saveloc: async()=>{
    const ad=$('#ad').value.trim(), mu=$('#mu').value.trim();
    if(!ad) throw new Error('اكتب العنوان');
    if(mu && !MAPRE.test(mu)) throw new Error('الرابط لازم يكون من خرائط جوجل');
    if(!GEO && ME.lat==null && !mu) throw new Error('حدد موقعك أو الصق رابط الخرائط');
    const u={address:ad,maps_url:mu}; if(GEO){u.lat=GEO.lat;u.lng=GEO.lng}
    ok(await sb.from('profiles').update(u).eq('id',ME.id));
    toast('تم حفظ الموقع'); await boot(TAB);
  },
  savewh: async()=>{
    const city=$('#wc').value.trim(), mo=parseFloat($('#wm').value||'0'), dd=$('#wd').value.trim();
    if(!(mo>=0)) throw new Error('الحد الأدنى غير صحيح');
    if(dd.length>100) throw new Error('مواعيد التوصيل طويلة قوي');
    ok(await sb.from('profiles').update({city,min_order:mo,delivery_days:dd}).eq('id',ME.id));
    toast('تم الحفظ'); await boot(TAB);
  },
  openloc: async el=>{
    const w=window.open('','_blank');
    const r=await sb.rpc('order_location',{oid:el.dataset.id});
    if(r.error){if(w)w.close();throw r.error}
    const x=r.data||{}, url = x.lat!=null ? `https://www.google.com/maps?q=${Number(x.lat)},${Number(x.lng)}` : x.url;
    if(!url || !MAPRE.test(url)){if(w)w.close();throw new Error('لا يوجد موقع مسجّل لهذه الصيدلية')}
    if(w) w.location=url; else location=url;
  },
  uplic: async()=>{
    const f=$('#lf').files[0], ex=$('#le').value;
    if(!f||!ex) throw new Error('اختار ملف الرخصة وتاريخ انتهائها');
    if(f.size>5*1024*1024) throw new Error('الملف أكبر من 5 ميجا');
    const ext=(f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
    const path=`${ME.id}/license-${Date.now()}.${ext}`;
    ok(await sb.storage.from('licenses').upload(path,f));
    ok(await sb.from('profiles').update({license_path:path,license_expiry:ex}).eq('id',ME.id));
    toast('تم رفع الرخصة، في انتظار المراجعة'); await boot(TAB);
  },
  addp: async()=>{
    const v=id=>$(id).value.trim(), name=v('#pn'), pp=parseFloat(v('#pp')), pd=parseFloat(v('#pd')||'0'), ps=parseInt(v('#ps'),10);
    if(!name) throw new Error('اكتب اسم المنتج');
    if(!(pp>=0)) throw new Error('السعر غير صحيح');
    if(!(pd>=0&&pd<=100)) throw new Error('الخصم لازم يكون بين 0 و 100');
    if(!(ps>=0)) throw new Error('الكمية غير صحيحة');
    ok(await sb.from('products').insert({warehouse_id:ME.id,name,brand:v('#pb'),category:v('#pc'),public_price:pp,warehouse_discount_pct:pd,stock:ps}));
    toast('تمت إضافة المنتج'); show('mine');
  },
  savestock: async el=>{
    const n=parseInt(document.getElementById('st-'+el.dataset.id).value,10);
    if(!(n>=0)) throw new Error('الكمية غير صحيحة');
    ok(await sb.from('products').update({stock:n}).eq('id',el.dataset.id).eq('warehouse_id',ME.id));
    toast('تم حفظ الكمية');
  },
  delp: async el=>{
    if(!confirm('حذف المنتج نهائياً؟')) return;
    ok(await sb.from('products').delete().eq('id',el.dataset.id).eq('warehouse_id',ME.id));
    loadMine();
  },
  whfilter: async el=>{ WHF=el.dataset.id; await show('prod') },
  whclear: async()=>{ WHF=null; await show('prod') },
  addc: async el=>{
    const id=el.dataset.id, q=parseInt(document.getElementById('q-'+id).value,10), o=OFF.find(x=>x.id===id);
    if(!o||o.price==null) throw new Error('المنتج غير متاح');
    if(!(q>=1)) throw new Error('الكمية غير صحيحة');
    const cur=(CART[id]?CART[id].q:0)+q;
    if(cur>o.stock) throw new Error('الكمية المتاحة '+o.stock+' فقط');
    CART[id]={name:o.name,price:Number(o.price),wh:o.warehouse_name,whid:o.warehouse_id,q:cur};
    paintNav(); toast('تمت الإضافة للسلة');
  },
  rmc: async el=>{delete CART[el.dataset.id];paintNav();paintCart()},
  placeo: async()=>{
    const e=Object.entries(CART); if(!e.length) throw new Error('السلة فاضية');
    const sums={}; e.forEach(([,v])=>{sums[v.whid]=(sums[v.whid]||0)+v.price*v.q});
    for(const [wid,s] of Object.entries(sums)){
      const w=WH.find(x=>x.id===wid), min=Number(w?w.min_order:0);
      if(s<min) throw new Error('الحد الأدنى للطلب من '+(w?w.business_name:'المخزن')+' هو '+money(min));
    }
    if(!confirm('إرسال الطلب؟')) return;
    ok(await sb.rpc('place_order',{items:e.map(([product_id,v])=>({product_id,qty:v.q}))}));
    CART={}; toast('تم إرسال الطلب'); await show('ord');
  },
  ostat: async el=>{
    const st=el.dataset.st;
    if((st==='rejected'||st==='cancelled')&&!confirm('متأكد؟')) return;
    if(st==='received'&&!confirm('تأكيد إنك استلمت الطلب؟')) return;
    if(st==='delivered'&&!confirm('تأكيد إنك سلّمت الطلب؟')) return;
    ok(await sb.rpc('update_order_status',{oid:el.dataset.id,new_status:st}));
    toast('تم التحديث'); await show(TAB);
  },
  rate: async el=>{
    const s=parseInt(prompt('قيّم المخزن من 1 (سيء) إلى 5 (ممتاز)'),10);
    if(!(s>=1&&s<=5)) return;
    const c=prompt('تعليق (اختياري)')||'';
    ok(await sb.rpc('rate_order',{p_oid:el.dataset.id,p_stars:s,p_comment:c}));
    toast('شكراً لتقييمك'); await show('ord');
  },
  savecomm: async()=>{
    const n=parseFloat($('#cm').value);
    if(!(n>=0&&n<100)) throw new Error('النسبة لازم تكون بين 0 و 99');
    ok(await sb.from('settings').update({commission_pct:n}).eq('id',1));
    toast('تم حفظ نسبة العمولة (للطلبات الجديدة بس)');
  },
  pay: async el=>{
    const id=el.dataset.id, n=parseFloat(document.getElementById('pa-'+id).value);
    if(!(n>0)) throw new Error('اكتب مبلغ صحيح');
    if(!confirm('تسجيل دفعة '+money(n)+'؟')) return;
    ok(await sb.from('payments').insert({warehouse_id:id,amount:n}));
    toast('تم تسجيل الدفعة'); await show('comm');
  },
  setst: async el=>{
    ok(await sb.rpc('set_account_status',{target:el.dataset.id,new_status:el.dataset.st}));
    await show('acct');
  },
  viewlic: async el=>{
    const w=window.open('','_blank');
    const r=await sb.storage.from('licenses').createSignedUrl(el.dataset.path,120);
    if(r.error){if(w)w.close();throw r.error}
    if(w) w.location=r.data.signedUrl; else location=r.data.signedUrl;
  }
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  e.preventDefault(); run(()=>A[el.dataset.act](el));
});
run(()=>boot());
</script>

  <script src="/admin-catalog.js"></script>
  <script src="/excel-upload.js"></script>
  <script src="/categories.js"></script>
  <script src="/warehouse-edit.js"></script>
  <script src="/support-pages.js"></script>
  <script src="/compact-ui.js"></script>
  <script src="/polish-ui.js"></script>
</body>
